
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NASA Space Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo">
      <div>
        <h1>Space Explorer</h1>
        <p>Discover the universe, one picture at a time.</p>
      </div>
    </header>

    <section class="fact-box">
      <h2>🌎 Did You Know?</h2>
      <p id="spaceFact">Loading a fun space fact...</p>
    </section>

    <section class="filters">
      <div class="date-field">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate">
      </div>

      <div class="date-field">
        <label for="endDate">End Date</label>
        <input type="date" id="endDate">
      </div>

      <button id="getImagesBtn" type="button">
        Get Space Images 🚀
      </button>
    </section>

    <div id="status" role="status" aria-live="polite"></div>

    <main>
      <div id="gallery" class="gallery">
        <div class="placeholder">
          <div class="placeholder-icon">🔭</div>
          <h2>Explore the Cosmos</h2>
          <p>Select a date range and click "Get Space Images" to explore NASA's Astronomy Picture of the Day!</p>
        </div>
      </div>
    </main>

  </div>

  <!-- Image Details Modal -->
  <div id="imageModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="closeModal" class="close-button" aria-label="Close modal">&times;</button>

      <img id="modalImage" src="" alt="" class="modal-image">

      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="modal-date"></p>
      <p id="modalExplanation"></p>

      <a id="videoLink" href="#" target="_blank" rel="noopener" hidden>
        Watch NASA video →
      </a>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>

</body>
</html>
